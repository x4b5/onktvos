      <h2>Pompeii</h2>
      <img src="media/pompeii.webp" width="1344" height="896" loading="lazy"
           alt="Pompeii, 79 n.Chr. Een oude Romein bekijkt de as op zijn toga terwijl de Vesuvius uitbarst. Hij denkt: dit krijg ik nooit meer uit mijn toga.">
    </section>

    <section class="cartoon">
      <h2>Camouflage</h2>
      <img src="media/soldaat.webp" width="1344" height="896" loading="lazy"
           alt="Een soldaat in een groen veldtenue staat in een moeras, met helikopters en rook achter hem. Hij denkt: dit heeft niets meer met fashion te maken.">
    </section>

    <section class="cartoon">
      <h2>Leesvoorkeur</h2>
      <img src="media/kabouter.webp?v=2" width="1024" height="1024" loading="lazy"
           alt="Een kabouter met een rode puntmuts, een ruige baard en een peuk in zijn mond staat tegen een blauwe muur. Zijn hemd is te kort voor zijn buik. Hij zegt: non-fictie kan m'n kloten kussen!">
    </section>

    <section class="cartoon">
      <h2>Vakadvies</h2>
      <img src="media/groenteboer.webp?v=2" width="1024" height="1024" loading="lazy"
           alt="Een groenteboer in een wit schort staat achter een stapel appels en een stapel peren en steekt belerend zijn vinger op. Hij zegt: dat is plasseks met poepseks vergelijken. Een kale klant met een appel en een peer in zijn handen kijkt hem wezenloos aan.">
    </section>

    <section class="cartoon">
      <img src="media/das-brot.webp" width="1024" height="1174" loading="lazy"
           alt="Das Brot. Een brood met grote ogen en rode lippen drijft in zee, met een duikbootkoepel en twee periscopen op zijn korst.">
    </section>

    <section class="cartoon">
      <h2>Nagesprek</h2>
      <img src="media/nagesprek.webp?v=2" width="1024" height="1024" loading="lazy"
           alt="Een man en een vrouw van middelbare leeftijd in leren riemenpakjes liggen naast elkaar op bed en roken een sigaret. Op het nachtkastje staan een kopje thee en een zweep. De man zegt: ik heb nooit iets met jazz gekund.">
    </section>

    <section class="cartoon">
      <h2>Laatste woorden</h2>
      <img src="media/laatste-woorden.webp?v=2" width="1024" height="1024" loading="lazy"
           alt="Jezus en een moordenaar hangen naast elkaar aan het kruis op een kale heuvel. Jezus draait zijn hoofd naar de ander en zegt: ik heb die bank toch maar teruggebracht. De moordenaar kijkt wezenloos voor zich uit.">
    </section>

    <section class="cartoon">
      <h2>Bezoekuur</h2>
      <img src="media/bezoekuur.webp?v=2" width="1024" height="1024" loading="lazy"
           alt="Een kindertekening in viltstift: de wolf ligt met een nachtmuts in oma's bed onder een bloemetjessprei, en Roodkapje staat met haar mandje naast het bed. De wolf zegt: mijn broer is weer bij zijn vrouw ingetrokken.">
    </section>

    <section class="cartoon">
      <h2>Slecht nieuws</h2>
      <img src="media/slecht-nieuws.webp" width="1536" height="1024" loading="lazy"
           alt="Een aquarel in de spreekkamer: een sombere dokter zit achter zijn bureau, naast hem een man met een enorme neus en een mond vol tanden die vrolijk zwaait, en zijn vrouw die geschrokken kijkt. De man zegt: nou, daar vergaat mijn zin om kanker nog als scheldwoord te gebruiken.">
    </section>

    <section class="cartoon">
      <h2>Het probleem</h2>
      <img src="media/het-probleem.webp" width="1536" height="1024" loading="lazy"
           alt="Een kindertekening in viltstift: een Franse snelweg tussen lavendelvelden en cipressen staat vast, beide rijstroken vol met kleine auto's, vrachtwagens en tientallen witte caravans tot aan de tolpoortjes. Een man in een rode auto zegt: tja, buitenlanders.">
    </section>

    <section class="cartoon">
      <h2>Eerste contact</h2>
      <img src="media/eerste-contact.webp" width="901" height="1024" loading="lazy"
           alt="Een kindertekening in viltstift: op een kale planeet met kraters en een geringde planeet aan de zwarte hemel staat een astronaut met open vizier naast een groen wezen met drie ogen en lange armen. Het wezen tilt een mandje friet uit een grote frituurpan met borrelend vet. De astronaut wijst naar de pan. Onderschrift: is dat plantaardig vet?">
    </section>

    <section class="cartoon">
      <h2>Waaghals</h2>
      <img src="media/waaghals.webp" width="1024" height="1024" loading="lazy"
           alt="Een man met een grote roze neus zit aan de keukentafel met zijn tong uit zijn mond een kleurplaat in te kleuren met een rood krijtje. Naast hem zit zijn vrouw achter de krant. Ze denkt: waaghals.">
    </section>

    <section class="cartoon">
      <h2>Mit Sahne</h2>
      <img src="media/mit-sahne.webp" width="1536" height="1139" loading="lazy"
           alt="Een tekening in inkt en waterverf: een lelijke wandelaar met rugzak, wandelstok, korte broek en een grote roze neus staat voor een herberg en gooit zijn armen juichend omhoog. Boven de deur hangt een bord: Apfelstrudel mit Sahne, nur 4,90 euro. Onderschrift: wat de F! Slagroom van Massachusetts Institute of Technology!">
    </section>

    <section class="cartoon">
      <h2>Vergeten groente</h2>
      <img src="media/vergeten-groente.webp" width="1536" height="1024" loading="lazy"
           alt="Een tekening in inkt, waterverf en kinderlijk kleurpotlood: een vrouw met een bleekgroen hoofd, stipogen en een enorme neus en een man met een paarse speldenkop en gele tanden zitten in een restaurant aan tafel. Op het witte bord tussen hen ligt een harige, paarsgrijze knobbel met een slangetje eraan. De vrouw zegt: de vergeten groenten zijn ook niet meer wat ze waren.">
    </section>

    <section class="cartoon">
      <h2>Laat werk</h2>
      <img src="media/laat-werk.webp" width="1536" height="1156" loading="lazy"
           alt="Een tekening in inkt en waterverf: in een kale museumzaal staan een dikke man met een grote roze neus en een schriel vrouwtje met een hangneus voor een reusachtig blauw beeld van twee billen op een witte sokkel. Ze kijken met lege gezichten recht in de bilnaad. Onderschrift: in zijn late werk wordt het blauw steeds verdrietiger.">
    </section>

    <section class="cartoon">
      <h2>Sambal</h2>
      <img src="media/sambal.webp" width="1536" height="1024" loading="lazy"
           alt="Een tekening in inkt en waterverf: een dikke man zit verstijfd op een keukenstoel met zijn mond wijd open en knalrode, opgezwollen ogen. Naast hem staat een vrouw in een bloemetjesschort met een potje sambal en een theelepel. Ze zegt: dan denk ik dat sambal toch tegen iets anders was dan oogontsteking.">
    </section>

    <section class="cartoon">
      <h2>De stoel</h2>
      <img src="media/de-stoel.webp" width="1536" height="1155" loading="lazy"
           alt="Een tekening in inkt en waterverf: in een woonkamer met vergeeld behang zit een dode man in een bruine fauteuil voor een oude tv, met een pijl door zijn hart en bloed op zijn vest. Naast hem staat zijn vrouw in een bloemetjesduster met haar hand op zijn arm. Twee ambulancebroeders in groen-gele pakken wachten met een lege brancard. Onderschrift: zitten is het nieuwe roken, zeggen ze.">
    </section>

    <section class="cartoon">
      <h2>Twaalf standen</h2>
      <img src="media/twaalf-standen.webp" width="1536" height="1196" loading="lazy"
           alt="Een tekening in inkt en waterverf op ruw papier: op een parkbankje zitten twee oude vrouwen met grijze permanentjes, paarse wangen en gestippelde vesten, met tussen hen een kale man met een rode knolneus, stoppels, een grijze trui en een bruine broek. Alle drie kijken stijf en uitdrukkingsloos recht vooruit. Naast de bank staan een prullenbak en een duif. Onderschrift: Sinds we die airfryer met acht standen hebben, praat Rob niet meer. Acht? Wij hebben er twaalf.">
    </section>

    <section class="cartoon">
      <h2>Debuut</h2>
      <img src="media/debuut.webp" width="1536" height="1024" loading="lazy"
           alt="Een tekening in inkt en waterverf op ruw papier: een oud echtpaar zit rechtop in bed onder een okergeel dekbed. De vrouw, met grijs warrig haar, een groen geruite pyjama en een dicht boek op het dekbed, kijkt opzij naar haar man. Hij is kaal, draagt een grijze pyjama en een ronde bril met witte glazen en kijkt recht vooruit. Zij zegt: er had flink in geschrapt mogen worden. Hij zegt: het is een debuut, Ineke.">
    </section>

    <section class="cartoon">
      <h2>Droge cake</h2>
      <img src="media/droge-cake.webp" width="1536" height="1085" loading="lazy"
           alt="Een tekening in zwarte inkt en grijze was, zonder kleur: in een kale rouwkamer zitten drie mensen in het zwart op plastic stoelen onder een portretfoto van een oude man op een ezel. Links een dikke kale zwager met een knolneus, rechts een schriele zus met een knotje die opzij kijkt. In het midden zit de weduwe met een handtas op schoot en daarop een bordje met een plakje cake, het enige in kleur. Onderschrift: jammer van de droge cake.">
    </section>
